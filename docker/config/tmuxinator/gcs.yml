windows:
  - ground_station:
      layout: tiled
      panes:
        - uav1_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav1
        - uav2_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav2
        - uav3_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav3
        - uav4_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav4
  - rviz:
      panes:
        - rviz_uav1: ros2 launch rviz_plugins flight_visualization.launch.py uav_namespace:=/uav1
  - topics:
      panes:
        - ros2 topic list
