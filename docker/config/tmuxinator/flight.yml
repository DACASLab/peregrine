name: flight
root: <%= ENV.fetch("ROS_WS", "/ros2_ws") %>

pre_window:
  - source /opt/ros/${ROS_DISTRO:-humble}/setup.bash
  - '[ -f install/setup.bash ] && source install/setup.bash || true'

windows:
  - stack: ${ROS_WS:-/ros2_ws}/docker/config/start_flight_stack.sh
  - shell:
  - tui: >
      export ROS_DOMAIN_ID=${DRONE_ID:-1};
      export ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-1};
      tmux resize-window -t "$(tmux display-message -p '#S:#I')" -x 120 -y 40;
      clear;
      ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav${DRONE_ID:-1}
