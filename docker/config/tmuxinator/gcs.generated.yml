name: gcs
root: <%= ENV.fetch("ROS_WS", "/ros2_ws") %>

pre_window:
  - source /opt/ros/${ROS_DISTRO:-humble}/setup.bash
  - '[ -f install/setup.bash ] && source install/setup.bash || true'
  - export ROS_DOMAIN_ID=99
  - clear

windows:
  - ground_station:
      layout: tiled
      panes:
        - uav1_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav1
        - uav2_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav2
        - uav3_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav3
        - uav4_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav4
        - uav5_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav5
        - uav6_tui: ros2 run tui_status tui_status_node --ros-args -p uav_namespace:=/uav6
  - rviz:
      panes:
        - rviz_multi: ros2 launch rviz_plugins multi_flight_visualization.launch.py num_uavs:=6 uav_namespace_prefix:=uav rviz_config:=${ROS_WS:-/ros2_ws}/docker/config/rviz/flight_visualization.generated.rviz
  - topics:
      panes:
        - ros2 topic list
