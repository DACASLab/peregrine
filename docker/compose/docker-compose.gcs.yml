# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.gcs.yml — Standalone Ground Control Station                ║
# ║                                                                            ║
# ║  Works for both simulation and hardware via generate_gcs_config.py.        ║
# ║  Build:  make build-gcs                                                    ║
# ║  Run:    make gcs  (auto-generates configs based on GCS_MODE)              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  gcs:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gcs
      args:
        RPI_BASE_IMAGE: ${RPI_BASE_IMAGE:-ros:humble-ros-base-jammy}
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        ROS_WS: ${ROS_WS:-/ros2_ws}
        CONTAINER_USER: ${CONTAINER_USER:-peregrine}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${PROJECT_NAME:-ros2-px4-flight}-gcs:latest
    container_name: ${PROJECT_NAME:-ros2-px4-flight}-gcs
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - DRONE_ID=99
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      - ROS_LOCALHOST_ONLY=0
      - ROS_WS=${ROS_WS:-/ros2_ws}
      # GCS generates its bridge config at startup; start the bridge below
      # after generation so .env.local hardware values cannot leak into sim.
      - ZENOH_BRIDGE_CONFIG=
      - ZENOH_PORT=${GCS_ZENOH_PORT:-7459}
      - GCS_MODE=${GCS_MODE:-sim}
      - GCS_UAV_IPS=${GCS_UAV_IPS:-}
      - GCS_NUM_UAVS=${GCS_NUM_UAVS:-}
      - GCS_DRONE_IDS=${GCS_DRONE_IDS:-}
      # Persist node + bridge logs to the bind-mounted workspace so they survive
      # container restart/removal and can be analyzed on the host post-flight.
      - ROS_LOG_DIR=${ROS_WS:-/ros2_ws}/logs/gcs
    volumes:
      - ../../:${ROS_WS:-/ros2_ws}:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOME}/.Xauthority:/home/${CONTAINER_USER:-peregrine}/.Xauthority:ro
    command: >
      bash -lc "
        set -e;
        python3 $${ROS_WS:-/ros2_ws}/docker/scripts/generate_gcs_config.py --env-file $${ROS_WS:-/ros2_ws}/docker/.env --mode $${GCS_MODE:-sim} --zenoh-port $${ZENOH_PORT:-7459} $${GCS_UAV_IPS:+--uav-ips $$GCS_UAV_IPS} $${GCS_NUM_UAVS:+--num-uavs $$GCS_NUM_UAVS} $${GCS_DRONE_IDS:+--drone-ids $$GCS_DRONE_IDS};
        export ROS_DOMAIN_ID=99;
        mkdir -p $${ROS_LOG_DIR:-$${ROS_WS:-/ros2_ws}/logs/gcs};
        zenoh-bridge-ros2dds -c $${ROS_WS:-/ros2_ws}/docker/config/zenoh/gcs_bridge.generated.json5 2>&1 | tee -a $${ROS_LOG_DIR:-$${ROS_WS:-/ros2_ws}/logs/gcs}/zenoh_bridge_$$(date +%Y%m%d-%H%M%S).log &
        source /opt/ros/$${ROS_DISTRO:-humble}/setup.bash &&
        [ -f $${ROS_WS:-/ros2_ws}/install/setup.bash ] && source $${ROS_WS:-/ros2_ws}/install/setup.bash;
        tmuxinator start -p $${ROS_WS:-/ros2_ws}/docker/config/tmuxinator/gcs.generated.yml
      "
