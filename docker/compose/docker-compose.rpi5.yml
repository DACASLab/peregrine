# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.rpi5.yml — Build & run on Raspberry Pi 5                   ║
# ║                                                                            ║
# ║  Build:   docker compose -f compose/docker-compose.rpi5.yml build          ║
# ║  Run:     DRONE_ID=1 docker compose -f compose/docker-compose.rpi5.yml up  ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  aircraft:
    build:
      context: ..
      dockerfile: docker/Dockerfile.rpi5
      args:
        RPI_BASE_IMAGE: ${RPI_BASE_IMAGE:-ros:humble-ros-base-jammy}
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        XRCE_DDS_VERSION: ${XRCE_DDS_VERSION:-v2.4.3}
        PX4_MSGS_BRANCH: ${PX4_MSGS_BRANCH:-main}
        PX4_ROS_COM_BRANCH: ${PX4_ROS_COM_BRANCH:-main}
        ROS_WS: ${ROS_WS:-/ros2_ws}
        CONTAINER_USER: ${CONTAINER_USER:-peregrine}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${REGISTRY:-ghcr.io/your-org}/${PROJECT_NAME:-ros2-px4-flight}-rpi5:latest
    container_name: ${PROJECT_NAME:-ros2-px4-flight}-aircraft-${DRONE_ID:-1}
    env_file: ../.env
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DRONE_ID=${DRONE_ID:-1}
      - ROS_WS=${ROS_WS:-/ros2_ws}
      - START_XRCE_AGENT=true
      - XRCE_DDS_PORT=${XRCE_DDS_PORT:-8888}
    volumes:
      - ../../:${ROS_WS:-/ros2_ws}:rw
    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0      # UART to Pixhawk (RPi5 default)
      - /dev/ttyUSB0:/dev/ttyUSB0      # USB serial (if used)
    command: bash
