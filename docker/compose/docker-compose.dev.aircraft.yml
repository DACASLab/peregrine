# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.dev.aircraft.yml — Dev override for Jetson/RPi aircraft    ║
# ║                                                                            ║
# ║  Layer on top of jetson/rpi5 compose files to mount host source:           ║
# ║    docker compose \                                                        ║
# ║      -f compose/docker-compose.jetson.yml \                                ║
# ║      -f compose/docker-compose.dev.aircraft.yml \                          ║
# ║      run --rm aircraft bash                                                ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  aircraft:
    volumes:
      - ../../src:/ros2_ws/src:rw
