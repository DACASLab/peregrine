# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  docker-compose.jetson.yml — Build & run on Jetson Orin Nano / NX          ║
# ║                                                                            ║
# ║  Build:   docker compose -f compose/docker-compose.jetson.yml build        ║
# ║  Run:     DRONE_ID=1 docker compose -f compose/docker-compose.jetson.yml up║
# ╚══════════════════════════════════════════════════════════════════════════════╝

services:
  aircraft:
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      args:
        JETSON_BASE_IMAGE: ${JETSON_BASE_IMAGE:-nvcr.io/nvidia/l4t-jetpack:r36.4.0}
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        ROS_WS: ${ROS_WS:-/ros2_ws}
        CONTAINER_USER: ${CONTAINER_USER:-peregrine}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ${PROJECT_NAME:-ros2-px4-flight}-jetson:latest
    container_name: ${PROJECT_NAME:-ros2-px4-flight}-aircraft-${DRONE_ID:-1}
    env_file: ../.env
    runtime: nvidia
    network_mode: host
    ipc: host
    privileged: true
    stdin_open: true
    tty: true
    environment:
      - DRONE_ID=${DRONE_ID:-1}
      - ROS_LOCALHOST_ONLY=${ROS_LOCALHOST_ONLY:-1}
      - ROS_WS=${ROS_WS:-/ros2_ws}
      - START_XRCE_AGENT=true
      - XRCE_DEVICE=/dev/ttyTHS1
      - XRCE_BAUD=3000000
      - ZENOH_BRIDGE_CONFIG=${ROS_WS:-/ros2_ws}/docker/config/zenoh/uav_bridge.json5
      - ZENOH_PORT=${ZENOH_PORT:-7447}
    volumes:
      - ../../:${ROS_WS:-/ros2_ws}:rw
      - /dev:/dev
      - /run/udev:/run/udev:ro
    # Note: privileged=true exposes all /dev/* — no explicit devices: needed.
    # UART default: /dev/ttyTHS1 (Orin), USB fallback: /dev/ttyUSB0
    command: bash -lc "tmuxinator start flight"
    restart: on-failure
